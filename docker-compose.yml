services:
  api:
    build: .
    container_name: gin-monolithic-api
    ports:
      - "8080:8080"
    environment:
      APP_NAME: gin-monolithic-boilerplate
      APP_ENV: local
      PORT: 8080
      GIN_MODE: release
      LOG_LEVEL: info
      CORS_ALLOWED_ORIGINS: "*"
      SHUTDOWN_TIMEOUT_SECONDS: 10
